services:
  db:
    image: postgres:17-alpine
    container_name: users-app-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: users_app
      POSTGRES_PASSWORD: users_app
      POSTGRES_DB: users_app
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

volumes:
  db-data:
