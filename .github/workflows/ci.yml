name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  DATABASE_URL: postgresql://users_app:users_app@localhost:5432/users_app_test?schema=public
  TEST_DATABASE_URL: postgresql://users_app:users_app@localhost:5432/users_app_test?schema=public

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: users_app
          POSTGRES_PASSWORD: users_app
          POSTGRES_DB: users_app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U users_app"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm exec prisma generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Apply migrations to test database
        run: pnpm exec prisma migrate deploy

      - name: Run tests
        run: pnpm test
